controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    franka_panda1_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
    franka_panda2_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
    franka_panda1_robot_model_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotModelBroadcaster
    franka_panda2_robot_model_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotModelBroadcaster
    dual_joint_impedance_example_controller:
      type: franka_example_controllers/MultiJointImpedanceExampleController
    dual_joint_velocity_example_controller:
      type: franka_example_controllers/DualJointVelocityExampleController

franka_panda1_robot_state_broadcaster:
  ros__parameters:
    arm_id: panda1
    frequency: 30

franka_panda2_robot_state_broadcaster:
  ros__parameters:
    arm_id: panda2
    frequency: 30

franka_panda1_robot_model_broadcaster:
  ros__parameters:
    arm_id: panda1
    frequency: 30

franka_panda2_robot_model_broadcaster:
  ros__parameters:
    arm_id: panda2
    frequency: 30

dual_joint_impedance_example_controller:
  ros__parameters:
    arm_count: 2
    arm_1:
      arm_id: panda1
      k_gains:
        - 24.0
        - 24.0
        - 24.0
        - 24.0
        - 10.0
        - 6.0
        - 2.0
      d_gains:
        - 2.0
        - 2.0
        - 2.0
        - 1.0
        - 1.0
        - 1.0
        - 0.5
    arm_2:
      arm_id: panda2
      k_gains:
        - 24.0
        - 24.0
        - 24.0
        - 24.0
        - 10.0
        - 6.0
        - 2.0
      d_gains:
        - 2.0
        - 2.0
        - 2.0
        - 1.0
        - 1.0
        - 1.0
        - 0.5

dual_joint_velocity_example_controller:
  ros__parameters:
    arm_1:
      arm_id: panda1
    arm_2:
      arm_id: panda2
