controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    # Pin the SCHED_FIFO priority of the controller_manager's own RT update thread explicitly.
    # ros2_control 4.45.2 falls back to 50 when this is unset (hardware_interface::HardwareInfo
    # and realtime_tools::AsyncFunctionHandler both hardcode that default). Setting it here makes
    # today's already-in-effect value explicit so a future ros2-control point release changing its
    # built-in default cannot silently change our real-time behaviour with no test noticing.
    thread_priority: 50
    # Keep synchronous console logging out of the real-time update loop. Deadline and overrun
    # observations remain available through controller-manager statistics and the bounded recorder.
    overruns:
      print_warnings: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    franka_panda1_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
    franka_panda2_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
    franka_panda1_robot_model_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotModelBroadcaster
    franka_panda2_robot_model_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotModelBroadcaster
    # Registration only, and only for the three REVIEWED_CONTROLLERS
    # (franka_bringup/controller_config_validator.py). No gains, limits or arm_ids appear
    # anywhere in this file for any motion controller: they arrive exclusively through the sealed
    # controller_param_file at guarded-motion spawn time, so a bare
    # `ros2 control load_controller <name> --set-state active` against a state-only production
    # launch cannot configure a motion controller from what ships here.
    #
    # 2026-08-29 (P0-B): dual_joint_impedance_example_controller
    # (franka_example_controllers/MultiJointImpedanceExampleController) and
    # dual_joint_velocity_example_controller
    # (franka_example_controllers/DualJointVelocityExampleController) used to be registered here
    # AND supplied with their complete inline parameter sets. Neither is in REVIEWED_CONTROLLERS
    # and neither carries any safety envelope, so one CLI command could put an unreviewed motion
    # controller in command of both real arms with no allow_motion gate and no validator
    # involvement. Both registrations and both parameter blocks are deleted. This is now enforced
    # structurally by test/test_production_controller_registrations.py (F-10m) -- re-adding either one
    # fails CI. one_arm_controllers.yaml has always followed this pattern.
    dual_arm_joint_hold_controller:
      type: franka_example_controllers/DualArmJointHoldController
    dual_arm_joint_impedance_controller:
      type: franka_example_controllers/DualArmJointImpedanceController
    dual_arm_joint_velocity_controller:
      type: franka_example_controllers/DualArmJointVelocityController

franka_panda1_robot_state_broadcaster:
  ros__parameters:
    arm_id: panda1
    frequency: 30

franka_panda2_robot_state_broadcaster:
  ros__parameters:
    arm_id: panda2
    frequency: 30

franka_panda1_robot_model_broadcaster:
  ros__parameters:
    arm_id: panda1
    frequency: 30

franka_panda2_robot_model_broadcaster:
  ros__parameters:
    arm_id: panda2
    frequency: 30
