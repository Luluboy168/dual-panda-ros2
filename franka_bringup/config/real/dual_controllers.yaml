controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    # Pin the SCHED_FIFO priority of the controller_manager's own RT update thread explicitly.
    # ros2_control 4.45.2 falls back to 50 when this is unset (hardware_interface::HardwareInfo
    # and realtime_tools::AsyncFunctionHandler both hardcode that default). Setting it here makes
    # today's already-in-effect value explicit so a future ros2-control point release changing its
    # built-in default cannot silently change our real-time behaviour with no test noticing.
    thread_priority: 50
    # Keep synchronous console logging out of the real-time update loop. Deadline and overrun
    # observations remain available through controller-manager statistics and the bounded recorder.
    overruns:
      print_warnings: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    franka_panda1_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
    franka_panda2_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
    franka_panda1_robot_model_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotModelBroadcaster
    franka_panda2_robot_model_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotModelBroadcaster
    dual_joint_impedance_example_controller:
      type: franka_example_controllers/MultiJointImpedanceExampleController
    dual_joint_velocity_example_controller:
      type: franka_example_controllers/DualJointVelocityExampleController
    # Registration only: the production launch does not load either controller, and their
    # required gains/limits remain absent until a separately reviewed motion configuration is used.
    dual_arm_joint_hold_controller:
      type: franka_example_controllers/DualArmJointHoldController
    dual_arm_joint_impedance_controller:
      type: franka_example_controllers/DualArmJointImpedanceController
    dual_arm_joint_velocity_controller:
      type: franka_example_controllers/DualArmJointVelocityController

franka_panda1_robot_state_broadcaster:
  ros__parameters:
    arm_id: panda1
    frequency: 30

franka_panda2_robot_state_broadcaster:
  ros__parameters:
    arm_id: panda2
    frequency: 30

franka_panda1_robot_model_broadcaster:
  ros__parameters:
    arm_id: panda1
    frequency: 30

franka_panda2_robot_model_broadcaster:
  ros__parameters:
    arm_id: panda2
    frequency: 30

dual_joint_impedance_example_controller:
  ros__parameters:
    arm_count: 2
    arm_1:
      arm_id: panda1
      k_gains:
        - 24.0
        - 24.0
        - 24.0
        - 24.0
        - 10.0
        - 6.0
        - 2.0
      d_gains:
        - 2.0
        - 2.0
        - 2.0
        - 1.0
        - 1.0
        - 1.0
        - 0.5
    arm_2:
      arm_id: panda2
      k_gains:
        - 24.0
        - 24.0
        - 24.0
        - 24.0
        - 10.0
        - 6.0
        - 2.0
      d_gains:
        - 2.0
        - 2.0
        - 2.0
        - 1.0
        - 1.0
        - 1.0
        - 0.5

dual_joint_velocity_example_controller:
  ros__parameters:
    arm_1:
      arm_id: panda1
    arm_2:
      arm_id: panda2
