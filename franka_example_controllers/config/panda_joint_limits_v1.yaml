schema_version: 1
libfranka_version: 0.9.2
arm_ids: [panda1, panda2]
joint_suffixes: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
hardware_command_interfaces: [effort, position, velocity]
hardware_state_interfaces: [effort, position, velocity]
