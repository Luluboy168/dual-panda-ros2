position_lower: [-2.8973, -1.7628, -2.8973, -3.0718, -2.8973, -0.0175, -2.8973]
position_upper: [2.8973, 1.7628, 2.8973, -0.0698, 2.8973, 3.7525, 2.8973]
urdf_velocity_ceiling: [2.175, 2.175, 2.175, 2.175, 2.61, 2.61, 2.61]
libfranka_velocity_ceiling:
  [2.129003, 2.151503, 2.144003, 2.136503, 2.564003, 2.549003, 2.549003]
libfranka_acceleration_ceiling:
  [14.999, 7.499, 9.999, 12.499, 14.999, 19.999, 19.999]
reviewed_timing_seconds:
  dual_arm_joint_velocity_controller:
    watchdog_timeout: 0.02
    max_header_age: 1.0
    future_tolerance: 0.1
  dual_arm_joint_impedance_controller:
    watchdog_timeout: 0.1
    max_header_age: 1.0
    future_tolerance: 0.1
