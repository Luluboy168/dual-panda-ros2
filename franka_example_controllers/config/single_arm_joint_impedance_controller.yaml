# Type registration only, exactly as dual_arm_joint_impedance_controller.yaml does. It exists so
# the one-arm-mode registration is documented as its own file even though the type string,
# controller name and class are unchanged from the two-arm registration: the same
# DualArmJointImpedanceController accepts an "arm_count" parameter of 1 or 2.
#
# One-arm-mode motion configuration additionally requires "arm_count: 1" and only the "arm_1.*"
# block (never "arm_2.*") in a separately reviewed controller_param_file. That file's arm_1.arm_id
# and arm_1.joint_names must match the arm_id chosen at launch time ("panda1" or "panda2"), so
# neither is baked into this file. Arm IDs, exact joint names, gains, effort/position/target-rate
# limits, and watchdog/header timing values are deliberately absent here; merely loading this file
# never configures or starts motion.
controller_manager:
  ros__parameters:
    dual_arm_joint_impedance_controller:
      type: franka_example_controllers/DualArmJointImpedanceController
