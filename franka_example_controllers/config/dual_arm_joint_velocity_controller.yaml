# This registers the controller type only. Arm IDs, exact joint names, both seven-element limit
# arrays, and all watchdog/header timing settings are deliberately required from a separately
# reviewed motion configuration. This file does not select or autostart any controller.
# Required parameters are arm_{1,2}.{arm_id,joint_names,max_velocity,max_acceleration} and the
# positive-second watchdog_timeout, max_header_age, and future_tolerance settings. JointJog
# frame_id must be empty, its stamp must be nonzero and within the configured receipt-time window,
# duration must be zero, and displacements must be empty. Per-joint limits may be stricter than, but
# never exceed, the preserved libfranka Panda velocity and acceleration ceilings. Disable, stale,
# missing, and invalid input writes zero directly on the next controller update cycle as an
# explicit safety-stop exception to the configured acceleration ramp. The realtime update's
# RealtimeBuffer read is nonblocking via Jazzy's try-lock path, but it is not lock-free.
# Hardware safe-command snapshots are the primary switch-boundary protection but can fail;
# controller-manager preshutdown still relies on this controller's lifecycle/release zero attempts.
controller_manager:
  ros__parameters:
    dual_arm_joint_velocity_controller:
      type: franka_example_controllers/DualArmJointVelocityController
