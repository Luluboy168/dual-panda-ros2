# This registers the controller type only, exactly as dual_arm_joint_hold_controller.yaml does.
# It exists so the one-arm-mode registration is documented as its own file even though the type
# string, controller name and class are unchanged from the two-arm registration: the same
# DualArmJointHoldController accepts an "arm_count" parameter of 1 or 2.
#
# One-arm-mode motion configuration additionally requires "arm_count: 1" and only the "arm_1.*"
# block (never "arm_2.*") in a separately reviewed controller_param_file; that file's arm_1.arm_id
# must be exactly the arm_id chosen at launch time ("panda1" or "panda2"), so it is not baked into
# this file. This file does not select, configure, or autostart any controller, and no k_gains,
# d_gains, or max_effort values are invented here -- each max_effort must still be finite,
# positive, and no greater than the Panda/URDF absolute ceilings [87, 87, 87, 87, 12, 12, 12] Nm.
# Hardware safe-command snapshots are the primary switch-boundary protection but can fail;
# controller-manager preshutdown still relies on this controller's lifecycle/release zero attempts.
controller_manager:
  ros__parameters:
    dual_arm_joint_hold_controller:
      type: franka_example_controllers/DualArmJointHoldController
