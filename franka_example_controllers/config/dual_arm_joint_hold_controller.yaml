# This registers the controller type only. The two arm IDs and all seven-element K/D/max-effort
# arrays are deliberately required from a separately reviewed motion configuration; this file does
# not select or autostart any controller. Each max_effort must be finite, positive, and no greater
# than the Panda/URDF absolute ceilings [87, 87, 87, 87, 12, 12, 12] Nm.
# Hardware safe-command snapshots are the primary switch-boundary protection but can fail;
# controller-manager preshutdown still relies on this controller's lifecycle/release zero attempts.
controller_manager:
  ros__parameters:
    dual_arm_joint_hold_controller:
      type: franka_example_controllers/DualArmJointHoldController
