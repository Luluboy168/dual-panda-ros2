<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Tandem Console &mdash; franka_web</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="chrome-wrap">
    <header class="chrome">
      <div class="brand">
        <span class="brand-name">TANDEM</span>
        <span class="brand-sub" id="brandSub">dual-Panda cell &middot; franka_web</span>
      </div>
      <div class="chrome-right">
        <span id="linkChip" class="chip chip-offline" hidden>reconnecting</span>
        <span id="simChip" class="chip chip-sim" hidden>Simulation</span>
        <div id="opBadge" class="op-badge"></div>
        <span id="recChip" class="rec" hidden><i></i>recording</span>
        <span id="stateChip" class="chip chip-idle">idle</span>
      </div>
    </header>
    <div class="hintbar">
      <span class="hint-label">Next</span>
      <span id="hintText"></span>
    </div>
    <div class="noticebar" id="noticeBar" role="status" hidden>
      <span class="notice-label">Note</span>
      <span id="noticeText"></span>
      <button type="button" class="linkbtn" data-act="notice-dismiss">Dismiss</button>
    </div>
    <p class="advisory" id="advisoryLine" hidden></p>
  </div>

  <main class="bench">
    <section class="card session" aria-label="Session setup">
      <h2 class="card-title">Session</h2>

      <div class="field">
        <div class="fieldlabel" id="armsLabel">Arms</div>
        <div class="seg" id="armSeg" role="group" aria-labelledby="armsLabel">
          <button type="button" class="seg-btn" data-act="arms" data-val="panda1">panda1</button>
          <button type="button" class="seg-btn" data-act="arms" data-val="panda2">panda2</button>
          <button type="button" class="seg-btn sel" data-act="arms" data-val="both">both</button>
        </div>
      </div>

      <div class="field" id="modeField">
        <div class="fieldlabel">Mode</div>
        <button type="button" class="mode-motion sel" data-act="mode" data-val="motion" aria-pressed="true">
          <span class="mode-name">Motion</span>
          <span class="mode-desc">Command the arms &mdash; from this console or your own ROS&nbsp;2 node</span>
        </button>
        <div class="mode-minor">
          <button type="button" class="mode-sm" data-act="mode" data-val="simulate" aria-pressed="false">
            <span class="mode-name">Simulate</span><span class="mode-desc">no robots needed</span>
          </button>
          <button type="button" class="mode-sm mode-watch" data-act="mode" data-val="watch" aria-pressed="false">
            <span class="mode-name">Watch</span><span class="mode-desc">observe only</span>
          </button>
        </div>
      </div>

      <div class="profile-line">
        <span id="profileText">Profile: reading&hellip;</span>
        <button type="button" class="info-btn" data-act="info"
                aria-label="About the active profile" aria-expanded="false">i</button>
        <div class="pop" id="infoPop" hidden></div>
      </div>

      <div class="startrow">
        <button type="button" class="btn btn-primary" id="btnStart" data-act="start">Start</button>
        <button type="button" class="btn btn-stop" id="btnStop" data-act="stop" disabled>Stop</button>
      </div>
    </section>

    <section id="stage" class="stage" aria-live="polite"></section>
  </main>

  <div class="dock">
    <section class="logdrawer" aria-label="ROS 2 logs">
      <button type="button" class="log-bar" id="logBar" data-act="log-toggle"
              aria-expanded="false" aria-controls="logBody">
        <span class="log-caret" id="logCaret" aria-hidden="true"><svg viewBox="0 0 10 10" width="9" height="9"><path d="M3 1.5 7 5 3 8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>Logs</span>
        <span class="log-badge" id="logBadge" hidden></span>
      </button>
      <div class="log-body" id="logBody" hidden>
        <div class="log-list" id="logList" role="log" aria-live="off" tabindex="0"></div>
      </div>
    </section>
  </div>

  <template id="tickTmpl"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 6.5 5 9.5 10 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></template>

  <script src="/app.js"></script>
</body>
</html>
