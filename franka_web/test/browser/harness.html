<!--
  NOT ONE LINE OF INLINE SCRIPT LIVES HERE, and that is the point. The suite is
  served under the production Content-Security-Policy, whose script-src is
  'self' with no unsafe-inline, so an inline <script> — a module one included —
  is refused outright and the whole suite silently never runs. Keeping every
  line in a file beside this one is what lets the harness run under the same
  policy the console does.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Franka scene browser tests</title>
  </head>
  <body>
    <pre id="verdict" data-status="running">{"ok":false,"status":"running"}</pre>
    <script src="../../static/ghost/vendor/three.r111.min.js"></script>
    <script type="module" src="./harness.js"></script>
  </body>
</html>
