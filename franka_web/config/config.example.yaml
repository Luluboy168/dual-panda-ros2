# franka_web configuration.
#
# Copy this file to ~/.config/franka_web/config.yaml and uncomment what you
# want to change. Every key is optional; the values shown are the defaults --
# with one exception, the "fence:" block, which is shown switched ON, because
# fence bounds under a switched-off fence are refused. The fence default is
# switched off, with the factory joint limits.
# Lines that start with "#|" are settings: delete the "#|" to use one. Lines
# that start with plain "#" are explanation.
#
# The file is validated at startup: a typo is refused with a message naming
# the key, what was found and what is allowed. Check it without starting the
# server with:  ros2 run franka_web franka_web_server --check-config
#
# ANGLES IN THIS FILE ARE DEGREES. Everything else is SI (seconds, newton-
# metres). The server converts to radians internally.

#| port: 8765                # 1024..65535
#| bind: "0.0.0.0"           # 0.0.0.0 = reachable from the lab network
#| ros_domain_id: null       # null = use $ROS_DOMAIN_ID if usable, else 0

#| robots:
#|   panda1:
#|     ip: "172.16.0.2"      # Franka factory default for the first arm
#|   panda2:
#|     ip: "172.16.0.3"      # Franka factory default for the second arm

#| directories:
#|   state: "~/.local/state/franka_web"
#|   recordings: "~/franka_web_recordings"
#|   franka_dir: null        # libfranka build directory for the RT preflight
# The 3D scene draws the measured cell from the workspace model's cell file.
# Leave cell_model null and the console looks where that package installs its
# own; set it when your cell file lives outside the install space.
#|   cell_model: null        # absolute path to cell_model_v1.yaml

#| recording:
#|   enabled: true           # false = never start the rosbag recorder

# How much recording is kept. The recorder writes about 4 MB every second --
# roughly 14 GB per hour -- so this cap is what stands between a busy week and
# a full disk. It is the TOTAL over every stored session; when the total is
# above it, whole sessions are removed OLDEST FIRST (by the timestamp in the
# directory name) until it is back under. The pass runs at server startup and
# again each time a session's bag is sealed, and writes one plain line per
# removal to the log drawer.
#
# Never removed: the session recording right now, and any session directory
# with no metadata.yaml -- a crashed session's bag is evidence. Both still
# count toward the total, and the summary line names them. Anything in the
# directory that this server did not write is left alone entirely.
#
# One GB is 1 000 000 000 bytes. 0 is refused; "unlimited" is how you keep
# every recording for ever. This section is HOW MUCH is kept; WHERE it is kept
# is directories.recordings above, and the on/off switch is recording.enabled.
#| recordings:
#|   max_total_gb: 50        # > 0, or "unlimited" to switch the cap off

#| jog:
#|   step_deg: 2.0           # one press of - / +, 0 < x <= 15

# Activation settling: the check that runs after the impedance controller is
# activated and before the session goes running. Each angular key takes one
# number (applied to all seven joints) or a list of seven.
#| settling:
#|   drift_limit_deg: 2.0        # each > 0 and <= 30
#|   span_limit_deg: 0.05        # each > 0
#|   velocity_limit_deg_s: 1.0   # each > 0
#|   fence_margin_deg: 5.0       # each >= 0
#|   stable_window_s: 1.0        # > 0
#|   min_samples: 6              # >= 2
#|   timeout_s: 5.0              # > stable_window_s and <= 60

# Motion profile per arm. The defaults are the live-proven values: panda1 uses
# the standard set, panda2 uses the same set with a stiffened joint 2 (K 60,
# D 2.0) adopted after its activation settle was dominated by a J2 residual.
# Torque ceilings are the safety bound and are the same on both arms.
#
# The controller's timing is NOT settable here: the watchdog timeout (0.1 s),
# the header-age limit (1.0 s) and the future tolerance (0.1 s) are fixed by
# the controller's reviewed timing policy. They are reported read-only by
# GET /api/config. Writing one of them in this file is an error.
#| profiles:
#|   panda1:
#|     stiffness: [20.0, 20.0, 20.0, 20.0, 10.0, 10.0, 60.0]
#|     damping: [1.0, 1.0, 1.0, 1.0, 0.5, 0.5, 1.0]
#|     torque_limit_nm: [10.0, 10.0, 10.0, 10.0, 5.0, 5.0, 3.0]
#|     speed_limit_deg_s: 5.729577951308233   # 0.1 rad/s
#|   panda2:
#|     stiffness: [20.0, 60.0, 20.0, 20.0, 10.0, 10.0, 60.0]
#|     damping: [1.0, 2.0, 1.0, 1.0, 0.5, 0.5, 1.0]
#|     torque_limit_nm: [10.0, 10.0, 10.0, 10.0, 5.0, 5.0, 3.0]
#|     speed_limit_deg_s: 5.729577951308233   # 0.1 rad/s

# Optional per-arm position sandbox. It is OFF unless you turn it on, and off
# means the arm uses the Panda factory joint limits unchanged. Turn it on only
# to work inside a tighter box; the bounds must stay inside the factory
# limits. There is no user interface for this.
#
# Uncomment ALL of the block below together: bounds without
# "enabled: true" are refused, because a bound that silently does nothing is
# exactly what this file's validation exists to prevent. The same three keys
# work under "panda2:".
#| fence:
#|   panda1:
#|     enabled: true
#|     lower_deg: [-166.0, -101.0, -166.0, -176.0, -166.0, -1.0, -166.0]
#|     upper_deg: [166.0, 101.0, 166.0, -4.0, 166.0, 215.0, 166.0]

# Robotiq 2F-85 grippers, one per arm, on their own USB-RS485 adapters. Off
# unless you turn them on, and a cell with no grippers looks exactly as it did
# before this key existed.
#
# The gripper drivers are their own ROS nodes and you start them yourself:
#   ros2 launch franka_robotiq dual_robotiq.launch.py \
#        panda1_serial_id:=usb-... panda2_serial_id:=usb-...
# They keep running across restarts of this server, which never starts or stops
# them. This block tells the server which arms HAVE a gripper (so it can show
# the row and check the bindings); the speed, force, widths and timeouts below
# are the values the driver's own configuration should carry -- the page always
# shows what the running node actually has. See franka_robotiq/doc/MOUNTING.md.
#
# serial_id is the BASENAME of an entry under /dev/serial/by-id/ -- run
#   ls -l /dev/serial/by-id/
# and copy the name. It binds this arm to that exact adapter, so a replug or a
# reboot can never swap the two grippers. Use usb_path instead (a basename
# under /dev/serial/by-path/) when the adapters report no unique serial; set
# exactly one of the two. See franka_robotiq/doc/SERIAL_BINDING.md.
#
# Widths are millimetres, force is newtons, speed is millimetres per second --
# no angles here, so nothing on this block is in degrees. The same thirteen
# keys work under "panda2:", and joint_names (two distinct names, one per
# finger) is left out on purpose: it is a contract with whatever consumes
# ~/joint_states, not something to edit casually.
#| grippers:
#|   panda1:
#|     enabled: false
#|     serial_id: ""              # e.g. usb-FTDI_FT230X_Basic_UART_D3091K4T-if00-port0
#|     usb_path: ""               # the alternative binding; set one, not both
#|     speed_mm_s: 85.0           # 20 <= x <= 150; the midpoint of the range
#|     force_n: 74.0              # 20 <= x <= 235; see the note below
#|     open_width_mm: 85.0        # what /open goes to; 0 <= x <= 85
#|     close_width_mm: 0.0        # what /close goes to; below open_width_mm
#|     poll_rate_hz: 20.0         # 1 <= x <= 100; the one rate knob
#|     auto_activate: true        # re-activate after the gripper loses power
#|     motion_timeout_s: 5.0      # 85 mm at the slowest 20 mm/s is 4.25 s
#|     activation_timeout_s: 10.0 # the rACT calibration cycle
#|     reconnect_interval_s: 2.0  # retry cadence while the link is down
#|   panda2:
#|     enabled: false
#|     serial_id: ""
#
# Why 74 N and not the midpoint of 20-235 N: 74 N is rFR 64, in the middle of
# the gripper's low-torque band, where re-grasp is on and the manufacturer
# describes the mode as "solid & fragile objects". The numeric midpoint,
# 127.5 N, maps to rFR 128 -- exactly the boundary into the high-torque band.
# For a lab picking unknown things, the low-torque band is the safe default.
