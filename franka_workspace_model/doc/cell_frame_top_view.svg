<svg width="680" height="380" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Cell frame, seen from above</title>
  <desc>Top view of the table as a rectangle with two robot bases on it. The origin sits halfway between the base centers on the table surface. Plus Y points from panda 2 toward panda 1, plus X points to the front where the arms work, plus Z comes up out of the table.</desc>
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="380" fill="#FFFFFF"/>
  <text x="20" y="30" font-family="sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">Cell frame — top view (how to measure your setup)</text>
  <rect x="100" y="60" width="480" height="240" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="118" y="86" font-family="sans-serif" font-size="12" fill="#5F5E5A">Table, seen from above</text>
  <circle cx="220" cy="220" r="34" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="220" y="216" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#085041">panda 1</text>
  <text x="220" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0F6E56">base center</text>
  <circle cx="460" cy="220" r="34" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="460" y="216" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#085041">panda 2</text>
  <text x="460" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0F6E56">base center</text>
  <line x1="254" y1="220" x2="426" y2="220" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="340" cy="220" r="7" fill="#534AB7"/>
  <rect x="288" y="240" width="104" height="22" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3C3489">origin (0, 0, 0)</text>
  <line x1="340" y1="204" x2="340" y2="120" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrB)"/>
  <rect x="294" y="96" width="92" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="111" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">+X  arms' front</text>
  <line x1="324" y1="220" x2="266" y2="220" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrB)"/>
  <rect x="256" y="182" width="112" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="312" y="197" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">+Y  toward panda 1</text>
  <circle cx="404" cy="196" r="9" fill="none" stroke="#185FA5" stroke-width="1.2"/>
  <circle cx="404" cy="196" r="2" fill="#185FA5"/>
  <rect x="420" y="185" width="118" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="479" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">+Z  up, out of table</text>
  <line x1="220" y1="270" x2="460" y2="270" stroke="#BA7517" stroke-width="1.5" marker-start="url(#arrA)" marker-end="url(#arrA)"/>
  <rect x="234" y="280" width="212" height="22" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="340" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854F0B">base separation: measure center-to-center</text>
  <text x="100" y="330" font-family="sans-serif" font-size="12" fill="#5F5E5A">You are standing here, behind the robots, looking along +X.</text>
  <text x="100" y="350" font-family="sans-serif" font-size="12" fill="#5F5E5A">Origin: on the table surface, halfway between the two base centers. Right-handed frame; meters in the file.</text>
</svg>
