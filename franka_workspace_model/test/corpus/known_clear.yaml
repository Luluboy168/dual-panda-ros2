# Corpus category: poses that must be reported clear.
#
# Every expectation in this file was derived by hand, or by an independent
# forward-kinematics chain, BEFORE the checker existed, and none of it was
# obtained by running the checker under test. A corpus entry whose expected
# answer came from the code being tested is worthless: it tests that the code
# still does what it did, not that what it does is right.
schema_version: 1
category: known_clear
entries:
  - id: clear_ready_both_arms
    q:
      panda1: [0.0, -0.7854, 0.0, -2.3562, 0.0, 1.5708, 0.7854]
      panda2: [0.0, -0.7854, 0.0, -2.3562, 0.0, 1.5708, 0.7854]
    expect:
      ok: true
      kinds: []
      forbidden_kinds: [joint_limit, self, cross_arm, containment, environment, keep_out]
    rationale: >-
      Franka "ready", the pose the lab actually uses; it is the SRDF group_state
      `ready` on both arms, so it is a pose the shipped model already blesses.
      Joint limits: every value sits inside the joint-limit policy with at least
      0.7156 rad to spare, the binding one being joint4 = -2.3562 in
      [-3.0718, -0.0698]. Self-collision: with j1 = j3 = j5 = 0 every link-frame
      origin lies in the plane y = +-0.50 (volumes with a lateral link-frame
      offset, like link5_v1 at +0.08, extend off it), and the tightest of the 15
      SRDF-enabled intra-arm link pairs is link5_v1 (the 0.055 m forearm-side
      capsule) against link7_v0. In the cell frame link5_v1 runs
      (0.158890, 0.580000, 0.697281) -> (0.018890, 0.580000, 0.697281) and
      link7_v0 runs (0.306890, 0.500000, 0.617280) -> (0.306890, 0.500000,
      0.757280); the first is an x-parallel segment whose largest x is 0.158890,
      the second is a z-parallel segment at x = 0.306890 whose z-span brackets
      0.697281, so the closest points are (0.158890, 0.580000, 0.697281) and
      (0.306890, 0.500000, 0.697281) and the distance is exactly
      sqrt(0.148^2 + 0.080^2) = 0.16823793 m. Subtracting 0.055 + 0.070 = 0.125
      leaves +0.0432379 m, which clears margins.self_collision = 0.02 by 23.2 mm.
      Cross-arm: two of the 81 link pairs tie EXACTLY for tightest, link2_v0 vs
      link2_v0 and link4_v0 vs link4_v0, both at +0.7000000 - a structural tie of
      the symmetric +-0.50 m mounting, not float noise, which is why the contact
      sort rule has to be deterministic. Taking link2: its capsule is +-0.06 m
      along the joint-2 axis, which at j1 = 0 points along the cell y axis, so the
      two capsules are the collinear segments y in [0.44, 0.56] and
      y in [-0.56, -0.44] at x = 0, z = 0.333. Their separation is
      2*(0.50 - 0.06) = 0.880000 m; minus 0.09 + 0.09 that is +0.7000000 m,
      clearing margins.cross_arm = 0.05 by 650 mm. Containment, all six faces
      evaluated: the binding volume at the floor is link2_v0 at cell z = 0.333
      with r = 0.09, giving 0.333 - 0.09 - 0 = +0.243000; at the ceiling it is
      link7_v0 at +1.17271966 against z_max = 2.0; at x_min = -0.35 it is
      link3_v0 at +0.08605141 (the same 0.246*sqrt(2)/2 = 0.17394827 offset behind
      the shoulder that the cross-arm entries turn on); at x_max = +0.90 it is
      link7_v0 at +0.52310965; at y_max = +1.00 a THREE-way tie at +0.350000
      between panda1's link2_v0, link4_v0 (both reaching y = 0.56 with r = 0.09)
      and link6_v0 (reaching y = 0.57 with r = 0.08); and at y_min = -1.00 a
      two-way tie at +0.350000 between panda2's link2_v0 and link4_v0, then
      link8_v0 at +0.379537. The tightest of all six faces is +0.086051, still
      2.9x the 0.03 margin, so containment correctly belongs in forbidden_kinds.
      link0_v0 and link1_v0 sit lower than link2_v0 but are exempt: their height
      above the table top cannot change. Because every URDF radius already
      contains safety_distance = 0.03, the true surface separations are
      0.0432 + 0.06 = 0.1032 m and 0.7000 + 0.06 = 0.7600 m. No environment solid
      and no enabled keep-out zone participates in this entry. Hand-derived, and
      the cell-frame coordinates were reproduced independently by a PyKDL chain
      and by a second hand-written transform chain agreeing to 1e-12.

      RE-DERIVED FOR THE MESH FENCE.  The verdict is unchanged and there is no
      min_clearance_max on this entry, but the number behind it moves and is worth
      recording.  The tightest real metal at the ready pose is 21.778618 mm, on
      panda1_link5_collision_2_st against panda1_link7_st - not the 23.2523 mm the
      raw collision meshes give, because those undercut the visual shell, and not
      the padded capsule figure either.  Against the ruled 10 mm margin on that pair
      the margin-adjusted minimum is +0.011779 m; against a flat 20 mm it would be
      +0.001779 m, which is how close the arm's own home pose sits to being refused
      by a margin nobody measured.
  - id: clear_wrist_unfolded_j6_zero
    q:
      panda1: [0.0, -0.7854, 0.0, -2.3562, 0.0, 0.0, 0.7854]
      panda2: [0.0, -0.7854, 0.0, -2.3562, 0.0, 1.5708, 0.7854]
    expect:
      ok: true
      kinds: []
      forbidden_kinds: [joint_limit, self, cross_arm, containment, environment, keep_out]
    rationale: >-
      THE POSE THAT STARTED THIS LINE OF WORK, and until now it was not in the
      corpus at all.  panda1 at ready with j6 unwound to 0; panda2 at ready.
      The operator put a tape measure between link5 and the flange, read about
      72 mm, and the shipped fence refused the pose.  It refused it on
      link5_v0 / link8_v0 at +12.1915 mm - a PADDED CAPSULE number, 30 mm of
      inflation on each radius, against a 20 mm margin.

      Every expectation below is derived from the independent oracle - a second
      forward-kinematics chain built from link_geometry_v1.yaml's own
      parent_joint origins, and a distance computed by away-step Frank-Wolfe
      over the Minkowski difference with an SLSQP quadratic program as the
      arbiter - and never from the checker under test.

        link5 <-> link7   21.566058 mm   the arm's true minimum here
        link5 <-> link8   72.288524 mm   the pair the operator taped
        pedestal          399.8147 mm    base_link box against link1
        cross-arm         741.1234 mm
        containment       118.5201 mm    nearest face of the work area

      So the tape was right about link5/link8 to within a millimetre, and the
      fence was wrong about it by 60 mm.  And the measurement says something
      the tape could not: link5/link8 is NOT the closest pair at this pose.
      link5/link7 at 21.57 mm is, and it is closest at every pose - it is the
      pair the manufacturer designed to pass within a couple of millimetres,
      and it can never open beyond 22.1 mm anywhere the arm can go.

      JOINT LIMITS.  j6 = 0 sits 0.0175 rad above its own lower bound of
      -0.0175 - exactly policy.max_joint_step_rad - so this entry doubles as
      the guard that a sloppy epsilon or a non-strict comparison does not turn
      the operator's pose into a joint-limit contact.  It is the same trap
      joint_limit_all_zero names from the other side.

      MARGIN-ADJUSTED MINIMUM.  Under the ruled 10 mm margin on link5/link7 the
      tightest EVALUATED slack is +0.011566 m (21.566058 - 10).  The fence
      reports +0.005825 m, which is smaller, and the difference is not an
      error: it is the certified lower bound of a pair the broad phase culled,
      contributed to the minimum on purpose so that the reported value is a
      true lower bound on the tightest slack rather than an over-estimate.  See
      doc/CONTRACT.md on what min_clearance means on a passing configuration.
      Under a flat 20 mm margin this pose would clear by 1.57 mm - which is the
      other half of the ruling in cell_model_v1.yaml.

  - id: clear_spread_outward_mirrored
    q:
      panda1: [0.7854, -0.5, 0.0, -1.5, 0.0, 1.2, 0.0]
      panda2: [-0.7854, -0.5, 0.0, -1.5, 0.0, 1.2, 0.0]
    expect:
      ok: true
      kinds: []
      forbidden_kinds: [joint_limit, self, cross_arm, containment, environment, keep_out]
    rationale: >-
      A second clear pose that is NOT the ready pose, so that "no false
      positives" is not tested only at the one configuration the SRDF already
      blesses. Both arms are turned 45 degrees away from the midplane
      (j1 = +-pi/4), the shoulder is dropped to -0.5 and the elbow bent to -1.5,
      with j3 = j5 = j7 = 0. The pair is mirror-symmetric under
      M(q) = (-q1, q2, -q3, q4, -q5, q6, -q7), so every cross-arm quantity is
      symmetric about y = 0. Joint limits: the binding joint is j2 = -0.5 in
      [-1.7628, 1.7628], 1.2175 rad from the nearer bound; every other joint has
      more. Self-collision: the tightest enabled intra-arm pair is again
      link5_v1 against link7_v0, at +0.039662204 m, clearing
      margins.self_collision = 0.02 by 19.7 mm - it is not the ready value
      because j6 = 1.2 rather than 1.5708 changes the wrist fold. Cross-arm: the
      tightest of the 100 volume pairs is link4_v0 against link4_v0 at
      +0.623285801 m, twelve times margins.cross_arm = 0.05; turning the arms
      outward can only increase the gap that the ready pose already opens to
      +0.700000. Containment: the tightest of the 104 volume-face evaluations is
      a two-way tie at x_min between panda1_link4_v0 and panda2_link4_v0 at
      +0.16164295 m, 5.4x margins.environment = 0.03, followed by
      panda2_link8_v0 at y_min with +0.16589389. Nothing is within any margin, so
      every kind belongs in forbidden_kinds. Derived with the independent
      forward-kinematics chain (numpy transforms cross-checked against PyKDL to
      1e-12), never by running the checker under test.

      RE-DERIVED FOR THE MESH FENCE.  Verdict unchanged.  The hand-derived
      "+0.039662204 m on link5_v1 / link7_v0" in the rationale above is a CAPSULE
      number and is superseded: the mesh fence reports a margin-adjusted minimum of
      +0.010737 m here.  That value is contributed by a pair the broad phase culled
      - its certified lower bound, which is a valid conservative contribution - and
      not by the tightest pair, which is why it is smaller than the raw gap.  See
      doc/CONTRACT.md on what min_clearance means on a PASSING configuration.
